# StructShadow 默认配置
# =====================

# 体素分辨率
resolution: 64

# 材料参数 (PLA)
material:
  youngs_modulus: 3.5e9      # Pa
  poisson_ratio: 0.36
  yield_stress: 50.0e6       # Pa
  density: 1.24e3             # kg/m³
  cell_size: 1.0              # 归一化

# FEM 求解器
solver:
  tolerance: 1.0e-5
  max_iterations: 500
  use_direct_solver_below: 20000

# PINO 架构
pino:
  modes: 16
  width: 64
  n_layers: 6
  in_channels: 4              # [rho, Fx, Fy, Fz]
  out_channels: 9             # [ux, uy, uz, sxx, syy, szz, syz, szx, sxy]
  lifting_channels: 64
  projection_channels: 64
  padding: 8

# PINO 训练
pino_training:
  batch_size: 8
  lr: 1.0e-3
  epochs: 200
  scheduler: cosine
  lambda_data: 1.0
  lambda_pde: 0.1
  lambda_bc: 1.0
  warmup_epochs: 10

# 修复 CNN
repair_cnn:
  channels: [16, 32, 32]
  kernel_size: 3
  delta_max: 0.3              # 最大加厚量

# 修复优化
repair:
  steps: 200
  lr: 1.0e-3
  lambda_structural: 10.0
  lambda_volume: 5.0
  lambda_shape: 20.0
  lambda_smooth: 1.0
  lambda_printable: 2.0
  volume_budget: 1.3          # 允许增加30%体积
  lambda_redistribution: 8.0  # 惩罚净增材，鼓励内部材料重分配
  lambda_locality: 4.0        # 约束加材/减材发生在正确区域
  shell_width: 2              # 保护外壳厚度，避免轮廓漂移
  high_stress_threshold: 0.65 # 高风险内部区域阈值
  low_stress_threshold: 0.20  # 低应力可减材区域阈值
  max_net_material_ratio: 0.02 # 允许最多 2% 的净增材

# 联合训练
joint:
  # Stage A: 形状形成
  stage_a:
    epochs: 500
    lr: 1.0e-3
  # Stage B: 结构修复
  stage_b:
    steps: 200
    lr: 1.0e-3
  # Stage C: 约束感知联合优化
  stage_c:
    epochs: 100
    lr: 1.0e-4

# ======= 方法论贡献配置 =======

# 贡献1: 增广拉格朗日法 (ALM)
alm:
  safety_factor_target: 1.5       # 安全系数硬约束 τ
  volume_budget_ratio: 1.3        # 体积预算 β
  overhang_limit: 0.15            # 悬垂比例上限
  rho_init: 1.0                   # 初始罚因子
  rho_max: 1000.0                 # 罚因子上限
  rho_growth: 2.0                 # 罚因子增长倍率
  mu_max: 1000.0                  # 乘子上限
  constraint_tol: 0.01            # 约束满足容差
  dual_update_interval: 5         # 对偶更新间隔
  improvement_threshold: 0.25     # 约束改善阈值
  lambda_appearance: 10.0         # 外观损失权重
  lambda_shape_preserve: 5.0      # 外形保持正则权重
  lambda_smoothness: 1.0          # 平滑正则权重

# 贡献3: 自适应梯度路由
gradient_routing:
  sil_loss_threshold: 0.5         # 剪影损失基准
  structure_priority_sf_ratio: 0.8  # SF < τ*ratio → 结构优先
  shape_priority_sil_ratio: 1.5     # sil > threshold*ratio → 外形优先
  interior_boost: 3.0             # 结构优先时内部梯度放大
  surface_boost: 3.0              # 外形优先时表面梯度放大
  repair_boost: 2.0               # 结构优先时修复梯度放大
  warmup_steps: 20                # 预热步数

surrogate:
  calibration_mode: inflation
  stress_inflation_factor: 1.15
  stress_quantile_margin: 0.95
  fem_probe_interval: 25
  rollback_on_fem_fail: true
  acceptance_metric: best_fem_feasible
  unsafe_region_weight: 2.5
  hard_case_replay_ratio: 0.35

evaluation:
  use_fem_for_final_metrics: true
  multi_load_aggregation: worst_case
  displacement_limit: 5.0e-3
  volume_budget_ratio: 1.3
  overhang_limit: 0.15
  silhouette_metric: mv_iou

# 载荷设置
loads:
  gravity: -9.81              # m/s²
  grip_force: 10.0            # N
  safety_factor_threshold: 1.5

# 数据集
dataset:
  num_samples: 2000
  train_ratio: 0.85
  val_ratio: 0.15

# 导出
export:
  min_wall_thickness: 0.8     # mm
  max_overhang_angle: 45.0    # degrees
  smoothing_iterations: 3
  marching_cubes_level: 0.5
