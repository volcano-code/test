# Stage C pilot configuration
# Keeps the same method semantics as default.yaml but shortens the schedule for
# smoke tests and early verified batches.

resolution: 64

material:
  youngs_modulus: 3.5e9
  poisson_ratio: 0.36
  yield_stress: 50.0e6
  density: 1.24e3
  cell_size: 1.0

pino:
  modes: 16
  width: 64
  n_layers: 6
  in_channels: 4
  out_channels: 9
  lifting_channels: 64
  projection_channels: 64
  padding: 8

repair_cnn:
  channels: [16, 32, 32]
  kernel_size: 3
  delta_max: 0.3

repair:
  steps: 40
  lr: 1.0e-3
  lambda_structural: 10.0
  lambda_volume: 5.0
  lambda_shape: 20.0
  lambda_smooth: 1.0
  lambda_printable: 2.0
  volume_budget: 1.3
  lambda_redistribution: 8.0
  lambda_locality: 4.0
  shell_width: 2
  high_stress_threshold: 0.65
  low_stress_threshold: 0.20
  max_net_material_ratio: 0.02

surrogate:
  calibration_mode: inflation
  stress_inflation_factor: 1.15
  stress_quantile_margin: 0.95
  fem_probe_interval: 20
  rollback_on_fem_fail: true
  acceptance_metric: best_fem_feasible
  unsafe_region_weight: 2.5
  hard_case_replay_ratio: 0.35

evaluation:
  use_fem_for_final_metrics: true
  multi_load_aggregation: worst_case
  displacement_limit: 5.0e-3
  volume_budget_ratio: 1.3
  overhang_limit: 0.15
  silhouette_metric: mv_iou
