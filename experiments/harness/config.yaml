# ShadowForge 实验统一配置 (所有 baseline 共用同一数据/split/分辨率)
dataset:
  silhouette_dir: data/silhouettes/bench3
  triples_seed: 1          # 固定采样种子, 保证 baseline 同集
  n_triples: 40
resolution:
  structure: 48            # 结构/认证分辨率 (PINO 原生)
  shadow: 256              # 投影分辨率 (解耦外壳)
selection:
  iou_min: 0.90
  erosion_min: 0.15
  save_band: [0.40, 0.75]
ground_truth:
  fem: smooth_mesh         # 'voxel'(旧,不可信) | 'smooth_mesh'(目标真值, 待实现)
  smooth_mesh_status: IN_PROGRESS   # 收敛后切到此, 重算全部认证数字
  yield_stress: 50.0e6
  tau: 1.3
split:
  seed: 0
  train: 0.5
  calib: 0.25
  eval: 0.25
